# Publish the gate and stamp the dev `auth` app, which runs it. The gate is on the request path of every
# agent-facing service, so this pipeline only runs on master: a broken gate would take down chromium, ocr
# and rooter with it.
steps:
  - name: build-and-push
    image: docker.io/library/docker:cli
    privileged: true
    environment:
      DOCKER_HOST: tcp://docker-beefcake-ci-1:2375
      IMAGE: docker.io/initialed85/token-gate
    backend_options:
      kubernetes:
        secrets:
          - name: dockerhub
            key: username
            target:
              env: DOCKERHUB_USER
          - name: dockerhub
            key: token
            target:
              env: DOCKERHUB_TOKEN
    commands:
      - docker info --format 'daemon={{.Name}} images_before={{.Images}}'
      - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USER" --password-stdin
      - docker build --platform=linux/amd64 -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest" .
      - docker push "$IMAGE:$CI_COMMIT_SHA"
      - docker push "$IMAGE:latest"
      - docker image inspect --format 'digest={{.RepoDigests}}' "$IMAGE:$CI_COMMIT_SHA"

  - name: deploy-home-ops
    image: docker.io/initialed85/wp-kustomize-deploy:latest
    depends_on: [build-and-push]
    settings:
      image: docker.io/initialed85/token-gate
      dir: clusters/dev/applications/auth
    backend_options:
      kubernetes:
        secrets:
          - name: home-ops-deploy-key
            key: id_ed25519
            target:
              env: PLUGIN_DEPLOY_KEY
          - name: home-ops-deploy-key
            key: known_hosts
            target:
              env: PLUGIN_KNOWN_HOSTS

when:
  - event: push
    branch: master
